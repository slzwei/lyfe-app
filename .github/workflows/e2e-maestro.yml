name: E2E (Maestro)

# Manual + nightly only at first. Promote to required-status after 2 weeks of stable runs.
on:
  workflow_dispatch:
  schedule:
    # 02:00 SGT (18:00 UTC) — runs after the day's commits land but before next-day work.
    - cron: '0 18 * * *'

concurrency:
  group: e2e-maestro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios-simulator:
    runs-on: macos-15
    # Bumped 90 → 120: build phase has been observed at 38–68 min depending
    # on CocoaPods cache state, and 03-events flaked at 10m vs its usual 3m
    # in run 25384980079, leaving only 22 min for the final flows before the
    # 90-min job cap cancelled the run with 8/10 already green. 120 covers
    # worst-case build + worst-case Maestro phase with headroom.
    timeout-minutes: 120

    env:
      # --- Mobile build env (baked in at xcodebuild time) ---
      EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      EXPO_PUBLIC_LYFE_SG_DOMAIN: ${{ secrets.STAGING_LYFE_SG_DOMAIN }}
      # E2E bypass flags — only set in this workflow. Lib functions short-circuit
      # so Maestro doesn't have to drive the camera / GPS / Rekognition.
      EXPO_PUBLIC_E2E_FACE_BYPASS: '1'
      EXPO_PUBLIC_E2E_LOCATION_BYPASS: '1'
      # Skip Linking.openURL for tel:/wa.me in lead detail Call/WhatsApp
      # handlers — they background the app on the iOS sim and hide the
      # ContactConfirmModal from Maestro. Modal flow itself is what we
      # want to test; URL handoff is real-device behavior covered by hand.
      EXPO_PUBLIC_E2E_LINKING_BYPASS: '1'
      # Skip the native iOS document picker + Supabase storage upload.
      # Maestro can't drive the native picker UI; the bypass synthesizes a
      # stub asset and writes only the candidate_documents DB row (file_url
      # under `e2e-bypass/...`). Seed-e2e.sql cleans those rows at run start.
      EXPO_PUBLIC_E2E_DOCUMENT_BYPASS: '1'
      # Sentry source-map upload runs as an Xcode build phase but the runner has
      # no SENTRY_AUTH_TOKEN. Disable it (matches eas.json's development profile).
      SENTRY_DISABLE_AUTO_UPLOAD: 'true'

      # --- Bootstrap script env (admin API + psql connection) ---
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      STAGING_SUPABASE_DB_URL: ${{ secrets.STAGING_SUPABASE_DB_URL }}

      # --- Maestro flow env (mock OTP creds — match staging custom-sms-hook) ---
      MOCK_PHONE: '+6580000003'
      MOCK_OTP: '555555'
      ADMIN_PHONE: '+6580000001'
      AGENT_PHONE: '+6580000004'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm ci

      # Native dirs are gitignored — generate them from app.config.js. The
      # postinstall patches in scripts/patch-*.sh have already run as part of
      # `npm ci` and modify node_modules sources, which prebuild then copies
      # into ios/. --no-install skips prebuild's auto pod install so we can
      # cache pods independently in the next step.
      - name: Expo prebuild (iOS)
        run: npx expo prebuild --platform ios --no-install --non-interactive

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/.cocoapods/repos
          key: ${{ runner.os }}-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-pods-

      - name: Install pods
        working-directory: ios
        run: pod install

      - name: Select Xcode
        # Pick the newest Xcode available on the runner. expo-image's iOS 26
        # symbol-effect code path (gated by @available(iOS 26.0, *)) needs
        # Xcode 26 SDK to compile; macos-15 ships both 16.x and 26.x.
        run: |
          ls /Applications/ | grep -E '^Xcode(_[0-9.]+)?(_beta)?\.app$' | sort -V | tail -1 | xargs -I{} sudo xcode-select -s "/Applications/{}"
          xcodebuild -version

      - name: Install psql + Maestro
        run: |
          # psql is preinstalled on macos-14 runners as part of Postgres.app — verify.
          which psql || brew install libpq && echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Bootstrap staging fixtures
        run: node scripts/e2e-bootstrap.mjs

      - name: Boot iOS simulator
        # macos-15 image ships iPhone 16 / 17 / Air / SE — no 15. Match any
        # base iPhone <number> + space + "(" so we exclude Pro/Pro Max/Plus
        # variants. Falls back to the first available iPhone if no base model.
        run: |
          xcrun simctl list devices available
          DEVICE_ID=$(xcrun simctl list devices available | grep -E "^\s+iPhone (1[5-9]|[2-9][0-9]) \(" | head -1 | grep -oE '[0-9A-F-]{36}')
          if [ -z "$DEVICE_ID" ]; then
            DEVICE_ID=$(xcrun simctl list devices available | grep -E "^\s+iPhone " | head -1 | grep -oE '[0-9A-F-]{36}')
          fi
          if [ -z "$DEVICE_ID" ]; then
            echo "No iPhone simulator found on this runner image"
            exit 1
          fi
          echo "Using DEVICE_ID=$DEVICE_ID"
          echo "DEVICE_ID=$DEVICE_ID" >> "$GITHUB_ENV"
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b

      - name: Build .app for simulator
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/Lyfe.xcworkspace \
            -scheme Lyfe \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath ios/build \
            -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build 2>&1 | (xcbeautify || cat)

      - name: Install app on simulator
        run: |
          APP_PATH="ios/build/Build/Products/Release-iphonesimulator/Lyfe.app"
          test -d "$APP_PATH" || (echo "App bundle not found at $APP_PATH" && exit 1)
          xcrun simctl install "$DEVICE_ID" "$APP_PATH"

      - name: Maestro version
        run: maestro --version

      # Stream Lyfe app's NSLog output to a file for the duration of the
      # Maestro run. console.log statements in the React Native app surface
      # here when not connected to Metro (CI Release builds).
      - name: Start simulator log capture
        run: |
          xcrun simctl spawn "$DEVICE_ID" log stream \
            --predicate 'processImagePath CONTAINS "Lyfe"' \
            --style compact \
            > /tmp/sim.log 2>&1 &
          echo "LOG_PID=$!" >> "$GITHUB_ENV"
          sleep 2

      - name: Run Maestro flows
        # MAESTRO_DRIVER_STARTUP_TIMEOUT — Maestro's xcodebuild test-without-
        # building install of the XCUITest runner intermittently exceeds the
        # default 60s startup probe on macos-15 runners ("iOS driver not
        # ready in time"). Bumped 60→180s in Phase 0; bumped 180→300s in
        # Phase 4b after two consecutive driver-startup flakes (runs
        # 25521856460 + 25524334306) where the driver took ~3min 24s to
        # come up. Bumped 300→600s after the post-merge validation run
        # 25961371832 hit the 300s ceiling before any flow started.
        # Typical driver startup is still 30–60s; the larger ceiling only
        # affects slow XCUITest runner startup on hosted macOS images.
        #
        # Subdirectory discovery is wired up via the `flows:` glob in
        # .maestro/config.yaml — passing both `.maestro/ .maestro/roles/`
        # caused Maestro to run the role flows twice (once per path arg).
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: '600000'
        run: |
          for attempt in 1 2; do
            echo "Maestro attempt ${attempt}/2"
            log="/tmp/maestro-attempt-${attempt}.log"

            set +e
            maestro test .maestro/ 2>&1 | tee "$log"
            status=${PIPESTATUS[0]}
            set -e

            if [ "$status" -eq 0 ]; then
              exit 0
            fi

            if grep -q "iOS driver not ready in time" "$log" && [ "$attempt" -lt 2 ]; then
              echo "Maestro iOS driver startup timed out; retrying once after simulator settles."
              xcrun simctl bootstatus "$DEVICE_ID" -b
              sleep 15
              continue
            fi

            exit "$status"
          done

      - name: Stop simulator log capture
        if: always()
        run: |
          if [ -n "$LOG_PID" ]; then
            kill "$LOG_PID" 2>/dev/null || true
          fi
          ls -la /tmp/sim.log 2>/dev/null || echo "no sim.log"

      # Pull diagnostic breadcrumbs. Each Maestro flow launches a fresh
      # app process, and lib/e2eDebugLog picks a unique filename per
      # process (e2e-debug-<unix-ms>.log). Concatenate all of them into
      # /tmp/app-debug.log so we see what every flow logged.
      - name: Read app-side debug log
        if: always()
        run: |
          APP_DATA=$(xcrun simctl get_app_container "$DEVICE_ID" com.shawnlee.lyfe data 2>/dev/null || true)
          DOCS="$APP_DATA/Documents"
          if [ -d "$DOCS" ]; then
            echo "=== files in app Documents ==="
            ls -la "$DOCS" | grep -E "e2e-debug" || echo "(no e2e-debug-* files)"
            echo "=== concatenated e2e-debug-*.log (one per flow, in time order) ==="
            : > /tmp/app-debug.log
            for f in $(ls "$DOCS"/e2e-debug-*.log 2>/dev/null | sort); do
              echo "--- ${f##*/} ---" | tee -a /tmp/app-debug.log
              cat "$f" | tee -a /tmp/app-debug.log
            done
            echo "=== end ==="
          else
            echo "no app Documents at $DOCS"
          fi

      - name: Upload Maestro debug output on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-${{ github.run_id }}
          path: |
            ~/.maestro/tests/**/*
            ~/.maestro/logs/**/*
            /tmp/sim.log
            /tmp/app-debug.log
          if-no-files-found: warn
          retention-days: 7
