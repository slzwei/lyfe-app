name: Synthetic — cron freshness

# R3: poll cron.job_run_details on staging hourly.
# Alerts if any of the four scheduled edge-function cron jobs misses its window.
# Cadence relaxed from */15 → hourly to fit GH Actions free-tier minutes;
# detection delay still bounded by the 20-min freshness window in the probe.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *' # hourly

permissions:
  contents: read
  issues: write

jobs:
  cron-freshness:
    runs-on: ubuntu-latest
    environment: synthetic-monitoring
    timeout-minutes: 5
    env:
      SYNTHETIC_KILL_SWITCH: ${{ vars.SYNTHETIC_KILL_SWITCH }}

    steps:
      - name: Honour kill switch
        if: ${{ vars.SYNTHETIC_KILL_SWITCH == 'true' }}
        run: |
          echo "SYNTHETIC_KILL_SWITCH=true — skipping."
          exit 0

      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/checkout@v4

      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install probe dependencies
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        run: npm ci --no-audit --no-fund

      - name: Run cron freshness probe
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node 01-cron-freshness.mjs

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: *Synthetic probe FAILED:* ${{ github.workflow }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK" || true
