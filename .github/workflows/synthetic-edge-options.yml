name: Synthetic — edge OPTIONS sweep

# R7: broad up-check for all 17 staging edge functions, every 10 min.
# 404 or network error = fail. Anything else (including 401/403/500) = pass.
# Staging only — prod descoped per zero-prod policy.

on:
  workflow_dispatch:
  # Uncomment after 48 h soak on workflow_dispatch.
  # schedule:
  #   - cron: '*/10 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  edge-options:
    runs-on: ubuntu-latest
    environment: synthetic-monitoring
    timeout-minutes: 5
    env:
      SYNTHETIC_KILL_SWITCH: ${{ vars.SYNTHETIC_KILL_SWITCH }}

    steps:
      - name: Honour kill switch
        if: ${{ vars.SYNTHETIC_KILL_SWITCH == 'true' }}
        run: |
          echo "SYNTHETIC_KILL_SWITCH=true — skipping."
          exit 0

      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/checkout@v4

      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install probe dependencies
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        run: npm ci --no-audit --no-fund

      - name: Run edge OPTIONS sweep
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node 02-edge-options.mjs
