name: Synthetic — invariants drain

# R6: hourly, read synthetic_invariant_violations (populated by pg_cron
# sweeper on staging) and open / close GH issues per violation.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '30 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  invariants-drain:
    runs-on: ubuntu-latest
    environment: synthetic-monitoring
    timeout-minutes: 5
    env:
      SYNTHETIC_KILL_SWITCH: ${{ vars.SYNTHETIC_KILL_SWITCH }}

    steps:
      - name: Honour kill switch
        if: ${{ vars.SYNTHETIC_KILL_SWITCH == 'true' }}
        run: |
          echo "SYNTHETIC_KILL_SWITCH=true — skipping."
          exit 0

      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/checkout@v4
      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install probe dependencies
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        run: npm ci --no-audit --no-fund

      - name: Run invariants drain
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node 09-invariants-drain.mjs
