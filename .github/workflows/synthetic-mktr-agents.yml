name: Synthetic — mktr-agents

# R5: calls the mktr-agents edge function with the MKTR API key, asserts
# 200 + masked phones. Every 30 min.

on:
  workflow_dispatch:
  # schedule:
  #   - cron: '*/30 * * * *'

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: synthetic-monitoring
    timeout-minutes: 5
    env:
      SYNTHETIC_KILL_SWITCH: ${{ vars.SYNTHETIC_KILL_SWITCH }}

    steps:
      - name: Honour kill switch
        if: ${{ vars.SYNTHETIC_KILL_SWITCH == 'true' }}
        run: |
          echo "SYNTHETIC_KILL_SWITCH=true — skipping."
          exit 0

      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/checkout@v4
      - if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install probe dependencies
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        run: npm ci --no-audit --no-fund

      - name: Run mktr-agents probe
        if: ${{ vars.SYNTHETIC_KILL_SWITCH != 'true' }}
        working-directory: scripts/synthetic
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          MKTR_API_KEY_STAGING: ${{ secrets.MKTR_API_KEY_STAGING }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node 06-mktr-agents.mjs
