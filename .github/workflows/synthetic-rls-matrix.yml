name: Synthetic — RLS authorisation matrix

# R2: every 6 hours, sign in as each probe role and run the RLS assertion
# matrix. Active failures open P0 issues labelled security-regression.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours

permissions:
  contents: read
  issues: write

jobs:
  rls-matrix:
    runs-on: ubuntu-latest
    environment: synthetic-monitoring
    timeout-minutes: 10

    steps:
      - name: Honour kill switch
        if: ${{ vars.SYNTHETIC_KILL_SWITCH == 'true' }}
        run: |
          echo "SYNTHETIC_KILL_SWITCH=true — skipping."
          exit 0

      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install probe dependencies
        working-directory: scripts/synthetic
        run: npm ci --no-audit --no-fund

      - name: Run RLS matrix probe
        working-directory: scripts/synthetic
        env:
          STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
          STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
          PROBE_ACCOUNT_PASSWORD: ${{ secrets.PROBE_ACCOUNT_PASSWORD }}
          SYNTHETIC_GH_TOKEN: ${{ secrets.SYNTHETIC_GH_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node 07-rls-matrix.mjs

      - name: Notify Slack on failure
        if: failure() && env.SLACK_WEBHOOK != ''
        env:
          SLACK_WEBHOOK: ${{ secrets.SLACK_ALERT_WEBHOOK }}
        run: |
          curl -sS -X POST -H 'Content-Type: application/json' \
            -d "{\"text\":\":rotating_light: *Synthetic probe FAILED (security-regression):* ${{ github.workflow }}\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>\"}" \
            "$SLACK_WEBHOOK" || true
