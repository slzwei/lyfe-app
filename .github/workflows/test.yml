name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci --legacy-peer-deps

      - name: Lint
        run: npm run lint

      - name: Type Check
        run: npx tsc --noEmit

      - name: Test with coverage
        run: npx jest --coverage

      - name: Validate Expo config
        run: npx expo-doctor@latest || echo "::warning::expo-doctor found issues — review output above"

      - name: Dependency audit
        run: npm audit --audit-level=high || echo "::warning::npm audit found high-severity vulnerabilities — review npm audit output above"
