# Flow: Open a lead, add a note, change status — and assert each landed.
# Login as agent (+6580000004), not manager — manager view shows
# "Limited actions available" and hides note/status action buttons,
# so the test must run as the user who actually owns leads in the seed.
# Requires: at least one lead assigned to the agent (lead1, lead2 are).
appId: com.shawnlee.lyfe

---

- runFlow:
    file: helpers/login-as.yaml
    env:
      phone: "80000004"

# Navigate to Leads tab via testID.
- tapOn:
    id: "tab-leads"
- waitForAnimationToEnd

# Wait for the list to render at least one card, then tap the first one.
# `lead-card-*` is the card testID; `tapOn` matches the first that's visible.
- extendedWaitUntil:
    visible:
      id: "leads-list"
    timeout: 10000
- tapOn:
    id: ".*lead-card-.*"
- waitForAnimationToEnd

# Confirm we're on the lead detail.
- assertVisible:
    id: "lead-status-badge"

# --- Add a note ---
- tapOn:
    id: "lead-note-action"
- waitForAnimationToEnd
- tapOn:
    id: "lead-note-input-field"
- inputText: "E2E test note"
# Hide the keyboard so the Save button (typically below the input)
# becomes tappable. Without this, on Release iOS the keyboard occludes
# lead-note-input-save and the tap silently no-ops.
- hideKeyboard
- waitForAnimationToEnd
- tapOn:
    id: "lead-note-input-save"
- waitForAnimationToEnd

# Assert the note appears in the activity list.
- extendedWaitUntil:
    visible: "E2E test note"
    timeout: 10000

# --- Change status to Contacted ---
- tapOn:
    id: "lead-status-action"
- waitForAnimationToEnd
- tapOn:
    id: "status-option-contacted"
- waitForAnimationToEnd

# Assert the status badge reflects the change.
- extendedWaitUntil:
    visible: "Contacted"
    timeout: 5000
