# Flow: Open a lead, add a note, change status — and assert each landed.
# Requires: at least one lead exists for the manager. Seeded by `npm run seed`.
appId: com.shawnlee.lyfe

---

- runFlow:
    file: helpers/login-as.yaml
    env:
      phone: "80000003"

# Navigate to Leads tab via testID.
- tapOn:
    id: "tab-leads"
- waitForAnimationToEnd

# Wait for the list to render at least one card, then tap the first one.
# `lead-card-*` is the card testID; `tapOn` matches the first that's visible.
- extendedWaitUntil:
    visible:
      id: "leads-list"
    timeout: 10000
- tapOn:
    id: ".*lead-card-.*"
- waitForAnimationToEnd

# Confirm we're on the lead detail.
- assertVisible:
    id: "lead-status-badge"

# --- Add a note ---
- tapOn:
    id: "lead-note-action"
- waitForAnimationToEnd
- tapOn:
    id: "lead-note-input-field"
- inputText: "E2E test note"
- tapOn:
    id: "lead-note-input-save"
- waitForAnimationToEnd

# Assert the note appears in the activity list.
- extendedWaitUntil:
    visible: "E2E test note"
    timeout: 5000

# --- Change status to Contacted ---
- tapOn:
    id: "lead-status-action"
- waitForAnimationToEnd
- tapOn:
    id: "status-option-contacted"
- waitForAnimationToEnd

# Assert the status badge reflects the change.
- extendedWaitUntil:
    visible: "Contacted"
    timeout: 5000
