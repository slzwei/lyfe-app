# Flow: Events tab smoke — list renders, create form opens, dismiss returns to list.
appId: com.shawnlee.lyfe

---

- runFlow:
    file: helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-events"
- waitForAnimationToEnd

# List visible.
- assertVisible:
    id: "events-list"

# Open create flow.
- tapOn:
    id: "events-create-button"
- waitForAnimationToEnd
- assertVisible:
    id: "event-create-title"

# Dismiss back to list.
- tapOn:
    text: "Cancel"
- waitForAnimationToEnd
- assertVisible:
    id: "events-list"
