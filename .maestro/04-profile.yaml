# Flow: Profile tab renders, sign-out returns to login.
appId: com.shawnlee.lyfe

---

- runFlow:
    file: helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

- assertVisible:
    id: "profile-user-hero"

# Scroll until sign-out is visible, then settle before tapping. The
# previous tight scrollUntilVisible → tapOn pair occasionally raced
# against momentum scroll on Release builds — the element was found,
# scroll continued past it, tapOn saw nothing visible. Adding a wait
# + retry makes this stable.
- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn:
    id: "profile-sign-out-button"
    retryTapIfNoChange: true
- waitForAnimationToEnd

# Confirm via the modal's testID — accessibilityLabel-only was brittle.
- tapOn:
    id: "sign-out-modal-confirm"
- waitForAnimationToEnd

# Land back on login.
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 10000
