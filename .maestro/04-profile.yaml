# Flow: Profile tab renders, sign-out returns to login.
appId: com.shawnlee.lyfe

---

- runFlow:
    file: helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

- assertVisible:
    id: "profile-user-hero"

# Scroll until "Sign Out" text is visible, then tap by text. testID
# `profile-sign-out-button` is set on the TouchableOpacity but Maestro
# on Release iOS builds was not reliably finding it via `id:` — even
# when the screenshot showed the button on-screen post-scroll. Text-
# based tapOn matches via accessibilityLabel/text and works reliably.
- scrollUntilVisible:
    element:
      text: "Sign Out"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Sign Out"
- waitForAnimationToEnd

# Confirm via the modal's testID — accessibilityLabel-only was brittle.
- tapOn:
    id: "sign-out-modal-confirm"
- waitForAnimationToEnd

# Land back on login.
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 10000
