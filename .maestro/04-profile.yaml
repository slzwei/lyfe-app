# Flow: Profile tab renders, sign-out returns to login.
appId: com.shawnlee.lyfe

---

- runFlow:
    file: helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

- assertVisible:
    id: "profile-user-hero"

# Scroll to sign-out and tap it.
- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "profile-sign-out-button"
- waitForAnimationToEnd

# Confirm via the modal's testID — accessibilityLabel-only was brittle.
- tapOn:
    id: "sign-out-modal-confirm"
- waitForAnimationToEnd

# Land back on login.
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 10000
