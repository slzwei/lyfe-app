# Flow: Profile tab renders, sign-out returns to login.
appId: com.shawnlee.lyfe

---

- runFlow:
    file: helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

- assertVisible:
    id: "profile-user-hero"

# Scroll until the sign-out button is visible, then tap by its
# accessibilityLabel ("Sign out of your account"). The button has
# accessibilityLabel set on the TouchableOpacity, which on iOS replaces
# the inner Text content in the accessibility tree — so tapping by
# "Sign Out" text didn't match. Tapping by the full label is the
# reliable identifier.
- scrollUntilVisible:
    element:
      text: "Sign out of your account"
    direction: DOWN
    timeout: 10000
- waitForAnimationToEnd
- tapOn: "Sign out of your account"
- waitForAnimationToEnd

# Confirm via the modal's testID — accessibilityLabel-only was brittle.
- tapOn:
    id: "sign-out-modal-confirm"
- waitForAnimationToEnd

# Land back on login.
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 10000
