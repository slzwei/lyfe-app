# Auth: Sign out flow — login, sign out, assert return to login screen.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
    timeout: 5000
- tapOn:
    id: "profile-sign-out-button"
- waitForAnimationToEnd
- tapOn:
    id: "sign-out-modal-confirm"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 10000
