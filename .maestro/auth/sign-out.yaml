# Auth: Sign out flow — login then sign out and verify return to login screen
appId: com.shawnlee.lyfe
---
- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

# Navigate to Profile tab (5-tab: 90%)
- tapOn:
    point: "90%,97%"
- waitForAnimationToEnd

# Sign out
- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
- tapOn:
    id: "profile-sign-out-button"
- waitForAnimationToEnd
- tapOn: "Confirm sign out"
- waitForAnimationToEnd

# Verify login screen
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 10000
