# Candidates: Manager browses team candidates list.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- runFlow:
    file: ../helpers/navigate-to-tab.yaml
    env:
      tab: "team"
- waitForAnimationToEnd

# Switch to Candidates segment within Team.
- tapOn:
    text: "Candidates"
- waitForAnimationToEnd

# At minimum, the segment must render — first card is asserted only if present.
- assertVisible: "Candidates"
