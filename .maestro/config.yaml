# Maestro E2E Configuration
# Run: maestro test .maestro/
# Single flow: maestro test .maestro/01-login.yaml

appId: com.shawnlee.lyfe

# Test discovery — Maestro defaults to top-level only when given a folder.
# We have to opt in to subfolders explicitly via inclusion globs. Files in
# `helpers/` are subflows. Files in `auth/`, `team/`, `candidates/`, `events/`,
# `profile/`, `roadshow/` are Phase 2+ scope and not yet wired up. Lead flows
# are listed individually so we can enable Phase 2b items (01-create,
# 08-view-mode-toggle, 09-realtime-mktr) one at a time as they stabilize.
flows:
  - "*.yaml"
  - "roles/*.yaml"
  - "leads/03-status-transition.yaml"
  # leads/04-call-activity.yaml      — Phase 2b (modal subtree invisible to Maestro)
  # leads/05-whatsapp-activity.yaml  — Phase 2b (same)
  # leads/06-reassign.yaml           — Phase 2b (ReassignModal subtree invisible)
  - "leads/07-search-filter.yaml"
  - "leads/10-agent-personal-only.yaml"
  # Phase 4a — candidate detail smoke flows (staff + pa).
  - "candidates/01-staff-detail.yaml"
  - "candidates/02-pa-detail.yaml"
  # Phase 4b — candidate mutations (status, schedule, upload). Create flows deferred.
  # candidates/03-create-from-staff.yaml — Phase 4b-tail (KeyboardAwareScrollView
  #   + iOS-26 + Maestro: phone field tap unreliable, 3 retry runs all flaked).
  # candidates/04-create-from-pa.yaml    — Phase 4b-tail (same; manager-picker
  #   modal-tree wall too).
  - "candidates/05-status-transition.yaml"
  - "candidates/06-schedule-interview.yaml"
  - "candidates/07-upload-document.yaml"
  # Phase 4c — negative path. Realtime DISC (08) deferred — detail
  # screen lacks progress_signals subscription + Maestro can't trigger
  # the DB UPDATE mid-flow without new infra.
  # candidates/08-realtime-disc-complete.yaml — Phase 4c-tail.
  - "candidates/09-pa-without-manager-blocked.yaml"

# Force the heaviest flow (lead lifecycle: login + navigate + add note +
# change status) to run FIRST while the simulator is fresh. Maestro's
# default discovery order put it last — by the 10th launchApp, the iOS
# XCUITest driver was getting desynced from the app process and viewHierarchy
# queries returned "Application is not running" even with the app process
# alive. Running the heavy flow up front avoids that pressure.
executionOrder:
  flowsOrder:
    - 02-lead-lifecycle

# Environment variables for mock mode
env:
  MOCK_PHONE: "+6580000003"
  MOCK_OTP: "555555"
  ADMIN_PHONE: "+6580000001"
  AGENT_PHONE: "+6580000004"
