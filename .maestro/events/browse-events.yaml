# Events: Browse list and verify list testID renders.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-events"
- waitForAnimationToEnd

- assertVisible:
    id: "events-list"

# Tap an event card if present (id-based regex matches any card row).
- tapOn:
    id: ".*events-card-.*"
    optional: true
- waitForAnimationToEnd
