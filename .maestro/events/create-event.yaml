# Events: Create a new event end-to-end and assert it lands on the list.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- runFlow:
    file: ../helpers/navigate-to-tab.yaml
    env:
      tab: "events"
- waitForAnimationToEnd

- tapOn:
    id: "events-create-button"
- waitForAnimationToEnd

- tapOn:
    id: "event-create-title"
- inputText: "E2E Test Meeting"

- tapOn:
    id: "event-create-publish"
- waitForAnimationToEnd

# Land back on events list with the created event visible.
- extendedWaitUntil:
    visible:
      id: "events-list"
    timeout: 10000
- extendedWaitUntil:
    visible: "E2E Test Meeting"
    timeout: 5000
