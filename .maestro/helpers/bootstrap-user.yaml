# Helper: Log in a mock user to create their auth + profile record
# Input: phone (last 8 digits)
appId: com.shawnlee.lyfe
input:
  phone: "80000001"
---
- launchApp

# Dismiss dev menu
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: "50%,10%"
    optional: true
- tapOn:
    point: "50%,10%"
    optional: true
- waitForAnimationToEnd

# Sign out if already logged in
- tapOn:
    point: "90%,97%"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
    timeout: 5000
    optional: true
- tapOn:
    id: "profile-sign-out-button"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Confirm sign out"
    optional: true
- waitForAnimationToEnd

# Handle onboarding if shown
- tapOn:
    id: "get-started-button"
    optional: true
- waitForAnimationToEnd

# Wait for login screen
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 15000

# Login
- tapOn:
    id: "login-phone-input"
- inputText: "${phone}"
- tapOn:
    id: "login-send-otp-button"
- extendedWaitUntil:
    visible: "Verify your number"
    timeout: 15000
- tapOn: "OTP input"
- inputText: "555555"

# Wait for either dashboard or onboarding
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd
