# Helper: Reach the login screen from any state.
# Idempotent — safe to call when already on the login screen, on the dashboard,
# or stuck in onboarding. Uses testIDs everywhere except for dev-menu dismissal,
# which is outside the app and unavoidable via coordinates.
appId: com.shawnlee.lyfe

---

# Dismiss Expo dev menu / welcome modal if present.
# These run outside the app, so testIDs aren't available — coordinates are correct here.
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: "50%,10%"
    optional: true
- waitForAnimationToEnd

# If we're already on the login screen, we're done.
- runFlow:
    when:
      visible:
        id: "login-phone-input"
    commands:
      - waitForAnimationToEnd

# If onboarding is showing, walk through Get Started → reach app.
- runFlow:
    when:
      visible:
        id: "get-started-button"
    commands:
      - tapOn:
          id: "get-started-button"
      - waitForAnimationToEnd

# If we're on the dashboard, sign out via Profile → Sign Out → confirm modal.
- runFlow:
    when:
      visible:
        id: "tab-profile"
    commands:
      - tapOn:
          id: "tab-profile"
      - waitForAnimationToEnd
      - scrollUntilVisible:
          element:
            id: "profile-sign-out-button"
          direction: DOWN
          timeout: 5000
      - tapOn:
          id: "profile-sign-out-button"
      - waitForAnimationToEnd
      - tapOn:
          id: "sign-out-modal-confirm"
      - waitForAnimationToEnd

# Final assertion — we MUST end on the login screen.
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 15000
