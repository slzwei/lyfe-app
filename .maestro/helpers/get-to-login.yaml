# Helper: Get to the login screen from any state
appId: com.shawnlee.lyfe

---

- runFlow: dismiss-dev-menu.yaml

# === Try sign-out path (if on dashboard) ===
- tapOn:
    point: "90%,97%"
    optional: true
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
    timeout: 5000
    optional: true

- tapOn:
    id: "profile-sign-out-button"
    optional: true
- waitForAnimationToEnd

- tapOn:
    text: "Confirm sign out"
    optional: true
- waitForAnimationToEnd

# === Handle onboarding (if stuck there after sign-out or fresh install) ===
# If on onboarding welcome or profile setup, clear state and reconnect
- runFlow: dismiss-dev-menu.yaml
