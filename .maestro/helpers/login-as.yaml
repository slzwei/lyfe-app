# Helper: Parameterized login — logs in as any mock user
# Input: phone (last 8 digits, e.g. "80000003" for manager)
appId: com.shawnlee.lyfe
input:
  phone: "80000003"
---

- launchApp

# Connect to Metro via deep link (handles dev launcher screen)
- openLink: "exp+lyfe-app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
- waitForAnimationToEnd
- waitForAnimationToEnd
- waitForAnimationToEnd

# Dismiss dev menu
- tapOn:
    text: "Continue"
    optional: true
- waitForAnimationToEnd
- tapOn:
    point: "50%,10%"
    optional: true
- tapOn:
    point: "50%,10%"
    optional: true
- waitForAnimationToEnd

# Go to Home first (leftmost tab, ~10%), then Profile (rightmost ~90%)
- tapOn:
    point: "10%,97%"
    optional: true
- waitForAnimationToEnd

# Sign out if logged in — navigate to Profile
- tapOn:
    point: "90%,97%"
    optional: true
- waitForAnimationToEnd
- scrollUntilVisible:
    element:
      id: "profile-sign-out-button"
    direction: DOWN
    timeout: 5000
    optional: true
- tapOn:
    id: "profile-sign-out-button"
    optional: true
- waitForAnimationToEnd
- tapOn:
    text: "Confirm sign out"
    optional: true
- waitForAnimationToEnd

# Wait for login screen
- extendedWaitUntil:
    visible:
      id: "login-phone-input"
    timeout: 15000

# Enter phone and OTP
- tapOn:
    id: "login-phone-input"
- inputText: "${phone}"
- tapOn:
    id: "login-send-otp-button"
- extendedWaitUntil:
    visible: "Verify your number"
    timeout: 15000
- tapOn: "OTP input"
- inputText: "555555"

# Wait for dashboard
- extendedWaitUntil:
    visible:
      id: "home-scroll-view"
    timeout: 20000
