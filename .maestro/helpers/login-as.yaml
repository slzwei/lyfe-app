# Helper: Log in as a mock user via OTP.
# Input: phone (last 8 digits, e.g. "80000003" for manager).
#
# Mock creds (mobile dev mode):
#   ADMIN     +6580000001
#   DIRECTOR  +6580000002
#   MANAGER   +6580000003
#   AGENT     +6580000004
#   PA        +6580000005
#   CANDIDATE +6580000007
#   OTP       555555 (any of the above)
appId: com.shawnlee.lyfe
input:
  phone: "80000003"

---

- launchApp

# If the dev-client launcher is showing (local Metro dev), connect to localhost.
# Skipped automatically on Release builds (CI) where the launcher isn't visible.
- runFlow:
    when:
      visible: "Connect to Metro"
    commands:
      - openLink: "exp+lyfe-app://expo-development-client/?url=http%3A%2F%2Flocalhost%3A8081"
      - waitForAnimationToEnd

# Reach the login screen, signing out if needed.
- runFlow: ensure-logged-out.yaml

# Phone entry.
- tapOn:
    id: "login-phone-input"
- inputText: "${phone}"
- tapOn:
    id: "login-send-otp-button"

# OTP entry.
- extendedWaitUntil:
    visible:
      id: "login-otp-input"
    timeout: 15000
- tapOn:
    id: "login-otp-input"
- inputText: "555555"

# iOS may show a notifications permission prompt after auth completes —
# AuthContext.fetchOrCreateUser calls Notifications.requestPermissionsAsync.
# Tap Allow optionally so the prompt doesn't block the home wait below.
- tapOn:
    text: "Allow"
    optional: true

# Land on dashboard.
- extendedWaitUntil:
    visible:
      id: "home-scroll-view"
    timeout: 20000
