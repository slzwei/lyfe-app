# Leads: Agent transitions a lead's status via the always-visible pill grid.
#
# Validates the lead-status-pill-X → status-updates loop. 02-lead-lifecycle
# already covers "new → contacted"; this exercises a different status (won)
# so we have orthogonal coverage. Idempotent: if the tapped lead is already
# 'won' from a prior run, the no-op leaves it 'won' and the assertion passes.
#
# Logged in as AGENT because the status pill grid is hidden in manager view
# (see app/(tabs)/leads/[leadId].tsx — `!isManagerView` gate; manager sees a
# static lead-status-chip instead).
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000004"

- tapOn:
    id: "tab-leads"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "leads-list"
    timeout: 10000

# Open whichever lead Maestro lands on first. The flow doesn't care which
# specific lead — only that the status loop works.
- tapOn:
    id: ".*lead-card-.*"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible:
      id: "lead-status-grid"
    timeout: 10000

# Status pills are always visible (no picker step). Tap 'Won', assert it lands.
- tapOn:
    id: "lead-status-pill-won"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Won"
    timeout: 5000
