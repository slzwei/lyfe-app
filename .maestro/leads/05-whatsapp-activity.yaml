# Leads: Agent logs a WhatsApp activity via the WhatsApp quick action → "Yes, sent".
#
# Same shape as 04-call-activity, validates the WhatsApp branch of the
# ContactConfirmModal. Idempotent — only appends an activity row.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000004"

- tapOn:
    id: "tab-leads"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "leads-list"
    timeout: 10000

- tapOn:
    id: ".*lead-card-.*"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "lead-whatsapp-action"
    timeout: 10000

# Trigger WhatsApp → ContactConfirmModal → Yes, sent.
#
# Match the modal button by visible TEXT instead of testID — Maestro on
# iOS 26 + macos-15 doesn't reliably propagate testIDs through RN's
# <Modal> wrapper to the accessibility tree. Tap-by-text uses the inner
# <Text> ("Yes, sent") which is always exposed.
- tapOn:
    id: "lead-whatsapp-action"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Yes, sent"
    timeout: 15000
- tapOn: "Yes, sent"
- waitForAnimationToEnd

# Activity feed renders an entry starting with "Sent WhatsApp" for sent.
- extendedWaitUntil:
    visible: "Sent WhatsApp"
    timeout: 10000
