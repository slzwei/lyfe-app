# Leads: Open Add Lead modal, verify form renders, dismiss.
# Note: full submit blocked by Maestro modal-textinput limitation on iOS.
# This flow guards the modal-renders contract only.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-leads"
- waitForAnimationToEnd

- tapOn:
    id: "leads-add-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "add-lead-save"
    timeout: 5000

- tapOn: "Cancel"
- waitForAnimationToEnd
