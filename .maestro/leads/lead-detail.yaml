# Leads: Open first lead, add note, change status — full assertions.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-leads"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "leads-list"
    timeout: 10000
- tapOn:
    id: ".*lead-card-.*"
- waitForAnimationToEnd

- assertVisible:
    id: "lead-status-badge"

# Add a note.
- tapOn:
    id: "lead-note-action"
- waitForAnimationToEnd
- tapOn:
    id: "lead-note-input-field"
- inputText: "Lead detail note"
- tapOn:
    id: "lead-note-input-save"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Lead detail note"
    timeout: 5000

# Status → contacted.
- tapOn:
    id: "lead-status-action"
- waitForAnimationToEnd
- tapOn:
    id: "status-option-contacted"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Contacted"
    timeout: 5000
