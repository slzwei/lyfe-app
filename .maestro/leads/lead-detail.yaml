# Leads: Open lead detail, add note, change status
appId: com.shawnlee.lyfe
---
- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

# Navigate to Leads tab (5-tab manager: 30%)
- tapOn:
    point: "30%,97%"
- waitForAnimationToEnd
- waitForAnimationToEnd

# Tap first lead card
- tapOn:
    point: "50%,30%"
- waitForAnimationToEnd

# Add a note
- tapOn:
    id: "lead-note-action"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "lead-note-input-field"
    optional: true
- inputText: "E2E test note"
- tapOn:
    id: "lead-note-input-save"
    optional: true
- waitForAnimationToEnd

# Change status
- tapOn:
    id: "lead-status-action"
    optional: true
- waitForAnimationToEnd
- tapOn:
    id: "status-option-contacted"
    optional: true
- waitForAnimationToEnd
