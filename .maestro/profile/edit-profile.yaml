# Profile: Open edit-profile sheet, verify it renders, dismiss.
# Note: TextInput focus inside RN modal sheets is unreliable in Maestro on iOS;
# this flow guards the sheet-renders contract only.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- tapOn:
    id: "tab-profile"
- waitForAnimationToEnd

- tapOn:
    text: "Edit Profile"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible:
      id: "edit-profile-save"
    timeout: 5000

# Dismiss by tapping the overlay (sheet auto-closes outside the card).
- tapOn:
    point: "50%,5%"
- waitForAnimationToEnd
- assertVisible:
    id: "profile-user-hero"
