# Profile: Navigate to notification preferences and verify the screen renders.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- runFlow:
    file: ../helpers/navigate-to-tab.yaml
    env:
      tab: "profile"
- waitForAnimationToEnd

- scrollUntilVisible:
    element:
      text: "Notifications"
    direction: DOWN
    timeout: 5000
- tapOn:
    text: "Notifications"
- waitForAnimationToEnd

- assertVisible: "Push Notifications"
- assertVisible: "PUSH NOTIFICATION PREFERENCES"

- scrollUntilVisible:
    element:
      text: "Open Device Settings"
    direction: DOWN
    timeout: 5000
- assertVisible: "Open Device Settings"
