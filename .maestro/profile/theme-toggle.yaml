# Profile: Toggle appearance theme between Dark and Light.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- runFlow:
    file: ../helpers/navigate-to-tab.yaml
    env:
      tab: "profile"
- waitForAnimationToEnd

- assertVisible:
    id: "profile-user-hero"

- scrollUntilVisible:
    element:
      text: "Appearance"
    direction: DOWN
    timeout: 5000

- tapOn:
    text: "Dark"
- waitForAnimationToEnd

- tapOn:
    text: "Light"
- waitForAnimationToEnd
