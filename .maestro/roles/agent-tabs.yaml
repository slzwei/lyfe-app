# Roles: Agent sees Home, Leads, Events, Profile only.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000004"

- assertVisible:
    id: "tab-home"
- assertVisible:
    id: "tab-leads"
- assertVisible:
    id: "tab-events"
- assertVisible:
    id: "tab-profile"

# Hidden tabs — assertNotVisible is strict (no `optional`).
- assertNotVisible:
    id: "tab-team"
- assertNotVisible:
    id: "tab-candidates"
- assertNotVisible:
    id: "tab-pa"
- assertNotVisible:
    id: "tab-admin"
- assertNotVisible:
    id: "tab-roadmap"

- assertVisible:
    id: "home-scroll-view"
