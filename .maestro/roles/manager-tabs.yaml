# Roles: Manager sees Home, Leads, Team, Events, Profile.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- assertVisible:
    id: "tab-home"
- assertVisible:
    id: "tab-leads"
- assertVisible:
    id: "tab-team"
- assertVisible:
    id: "tab-events"
- assertVisible:
    id: "tab-profile"

- assertNotVisible:
    id: "tab-pa"
- assertNotVisible:
    id: "tab-candidates"
- assertNotVisible:
    id: "tab-admin"
- assertNotVisible:
    id: "tab-roadmap"
