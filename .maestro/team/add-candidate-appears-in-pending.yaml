# Regression: candidate created via Add Candidate must appear in Team → Pending.
# Guards the create-candidate edge function's mirror insert into member_invitations.
# Prereq: Manager logged in
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- runFlow:
    file: ../helpers/navigate-to-tab.yaml
    env:
      tab: "team"
- waitForAnimationToEnd

# Open Add Candidate
- tapOn:
    id: "team-add-candidate-button"
    optional: true
- tapOn:
    text: "Add Candidate"
    optional: true
- waitForAnimationToEnd

- tapOn:
    id: "add-candidate-name"
- inputText: "Pending Regression"

- tapOn:
    id: "add-candidate-phone"
- inputText: "+6599997777"

- tapOn:
    id: "add-candidate-submit"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Candidate Created"
    timeout: 10000

# Dismiss success modal back to team
- tapOn:
    text: "Done"
- waitForAnimationToEnd

# Switch to Pending filter and verify candidate is listed
- tapOn:
    text: "Pending"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Pending Regression"
    timeout: 5000
- assertVisible: "Candidate"
