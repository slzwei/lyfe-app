# Team: Manager adds a candidate via Team → Add Candidate.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- runFlow:
    file: ../helpers/navigate-to-tab.yaml
    env:
      tab: "team"
- waitForAnimationToEnd

# Open Add Candidate.
- tapOn:
    text: "Add Candidate"
- waitForAnimationToEnd

- tapOn:
    id: "add-candidate-name"
- inputText: "E2E Test Candidate"

- tapOn:
    id: "add-candidate-phone"
- inputText: "+6599998888"

- tapOn:
    id: "add-candidate-submit"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Candidate Created"
    timeout: 10000
