# Team: Manager invites a new agent via Team → Invite.
appId: com.shawnlee.lyfe
---

- runFlow:
    file: ../helpers/login-as.yaml
    env:
      phone: "80000003"

- runFlow:
    file: ../helpers/navigate-to-tab.yaml
    env:
      tab: "team"
- waitForAnimationToEnd

- tapOn:
    id: "team-invite-button"
- waitForAnimationToEnd

- tapOn:
    id: "invite-name-input"
- inputText: "E2E Test Agent"

- tapOn:
    id: "invite-phone-input"
- inputText: "99999999"

- tapOn:
    id: "invite-role-picker"
- waitForAnimationToEnd
- tapOn:
    text: "Agent"
- waitForAnimationToEnd

- tapOn:
    id: "invite-submit-button"
- waitForAnimationToEnd

- extendedWaitUntil:
    visible: "Invitation Sent"
    timeout: 10000
