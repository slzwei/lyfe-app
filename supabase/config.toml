# A string used to distinguish different Supabase projects on the same host. Defaults to the
# working directory name when running `supabase init`.
project_id = "lyfe-app"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[api.tls]
enabled = false

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.pooler]
enabled = false
port = 54329
pool_mode = "transaction"
default_pool_size = 20
max_client_conn = 100

[realtime]
enabled = true

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"
openai_api_key = "env(OPENAI_API_KEY)"

[inbucket]
enabled = true
port = 54324
smtp_port = 54325
pop3_port = 54326

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.image_transformation]
enabled = true

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["https://127.0.0.1:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false
minimum_password_length = 6

[auth.sms]
enable_signup = true
enable_confirmations = true
template = "Your Lyfe verification code is {{ .Code }}. Valid for 10 minutes."

[auth.sms.test_otp]
"6580000001" = "555555"
"6580000002" = "555555"
"6580000003" = "555555"
"6580000004" = "555555"
"6580000005" = "555555"
"6580000006" = "555555"
"6590000001" = "555555"
"6590000002" = "555555"
"6590000003" = "555555"
"6590000004" = "555555"
"6590000005" = "555555"
"6590000006" = "555555"
"6590000007" = "555555"
"6590000008" = "555555"
"6590000009" = "555555"

[auth.sms.twilio]
enabled = false
account_sid = "env(TWILIO_ACCOUNT_SID)"
message_service_sid = "env(TWILIO_MESSAGE_SERVICE_SID)"
auth_token = "env(TWILIO_AUTH_TOKEN)"

[auth.mfa]
max_enrolled_factors = 10

[edge_runtime]
enabled = true
policy = "oneshot"

# Functions called by external systems that authenticate via something other
# than a Supabase JWT. Without verify_jwt = false, the platform gateway rejects
# these requests with UNAUTHORIZED_NO_AUTH_HEADER before the function runs.

[functions.receive-mktr-lead]
# HMAC-SHA256 signature in X-Webhook-Signature (MKTR_WEBHOOK_SECRET).
verify_jwt = false

[functions.mktr-agents]
# Custom bearer token (MKTR_API_KEY), not a Supabase-issued JWT.
verify_jwt = false

[functions.custom-sms-hook]
# Invoked by Supabase Auth during SMS OTP dispatch — no user JWT exists yet.
verify_jwt = false

[analytics]
enabled = false

[experimental]
orioledb_version = ""
s3_host = "env(S3_HOST)"
s3_region = "env(S3_REGION)"
s3_access_key = "env(S3_ACCESS_KEY)"
s3_secret_key = "env(S3_SECRET_KEY)"
